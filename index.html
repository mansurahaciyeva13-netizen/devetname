<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mənsu & Elməddin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3eafa;
            color: #4a285d;
        }

        .invitation {
            max-width: 600px;
            margin: auto;
            background: white;
            min-height: 100vh;
            text-align: center;
            padding: 50px 25px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .date {
            font-size: 22px;
            margin: 30px 0;
        }

        .location {
            margin-top: 40px;
        }

        .location h2 {
            font-size: 28px;
        }

        .map {
            width: 100%;
            height: 350px;
            border: 0;
            border-radius: 20px;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 25px;
            background: #6b3b7c;
            color: white;
            text-decoration: none;
            border-radius: 30px;
        }
    </style>
</head>

<body>

<div class="invitation">

    <h1>Mənsu & Elməddin</h1>

    <p>Əziz qonağımız,</p>

    <p>
        Xüsusi günümüzdə sizi də aramızda görməkdən
        böyük məmnuniyyət duyacağıq.
    </p>

    <div class="date">
        📅 20 Sentyabr 2026<br>
        ⏰ 19:00
    </div>

    <div class="location">

        <h2>📍 Məkanımız</h2>

        <p>
            Toy mərasimimizə dəvətlisiniz
        </p>

        <!-- XƏRİTƏ BURAYA GƏLƏCƏK -->

        <div style="
        ">
        <iframe
    src="https://www.google.com/maps?q=Mona+Liza+Restaurant,+102+Yusif+Vazir+Chamanzaminli,+Baku&output=embed"
    width="100%"
    height="350"
    style="border:0; border-radius:20px;"
    allowfullscreen=""
    loading="lazy">
</iframe>
        </div>

        <a class="button"
           href="https://maps.google.com"
           target="_blank">
            📍 Google Maps-də aç
        </a>

    </div>

</div>

</body>
</html>
